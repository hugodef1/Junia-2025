name: CI/CD Pipeline

on:
  push:
    branches:
      - develop

jobs: # <-- Le mot-clé "jobs" doit être au-dessus de la liste de tous tes jobs
  lint: # <-- Ce job doit être indenté
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: PHP Linting
        run: |
          find . -name "*.php" -print0 | xargs -0 -n1 php -l

  build: # <-- Ce job doit être au même niveau d'indentation que "lint"
    runs-on: self-hosted
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: |
          docker build -t app .

  push: # <-- Ce job aussi
    runs-on: self-hosted
    needs: build
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push Docker Image
        run: |
          docker tag app:latest ton_utilisateur/app:latest
          docker push ton_utilisateur/app:latest

  deploy: # <-- Et celui-ci également
    runs-on: self-hosted
    needs: push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Connexion SSH réussie, début du déploiement..."
            cd ~/Junia-2025
            git pull
            docker-compose pull
            docker-compose up -d --force-recreate
            echo "Déploiement terminé !"
